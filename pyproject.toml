[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fare-verifier"
version = "0.1.0"
description = "FARE: Forensic Acceptance Region Estimation for Catching Bait-and-Switch Image Generators"
requires-python = ">=3.9"
authors = [{name = "Kai Yao"}, {name = "Marc Juarez"}]
dependencies = ["numpy>=1.24", "torch>=2.1", "torchvision>=0.16", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
attack = ["lpips>=0.1.4"]

[project.urls]
Repository = "https://github.com/kaikaiyao/FARE"
Paper = "https://openreview.net/forum?id=biz1Z9lOtc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
